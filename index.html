<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Diffchecker</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><rect x='3' y='3' width='7' height='18' rx='1'/><rect x='14' y='3' width='7' height='18' rx='1'/></svg>">
	<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
	<header>
		<div class="header-left">
			<svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<rect x="3" y="3" width="7" height="18" rx="1"/>
				<rect x="14" y="3" width="7" height="18" rx="1"/>
			</svg>
			<h1>Diffchecker</h1>
		</div>
		<div class="header-controls">
			<div class="control-group">
				<span class="control-label">Diff</span>
				<div class="toggle-group">
					<button class="toggle-btn" data-diff="line">Line</button>
					<button class="toggle-btn active" data-diff="word">Word</button>
					<button class="toggle-btn" data-diff="char">Char</button>
				</div>
			</div>
			<button id="theme-toggle" class="theme-toggle" title="Toggle theme">&#9788;</button>
		</div>
	</header>

	<main>
		<div class="input-row">
			<div class="input-pane">
				<div class="pane-header">
					<label>Original</label>
				</div>
				<textarea id="left-input" placeholder="Paste original text here..." spellcheck="false"></textarea>
			</div>
			<div class="input-pane">
				<div class="pane-header">
					<label>Modified</label>
				</div>
				<textarea id="right-input" placeholder="Paste modified text here..." spellcheck="false"></textarea>
			</div>
		</div>
		<div class="diff-output" id="diff-output"></div>
	</main>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
