<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Diffchecker</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><rect x='3' y='3' width='7' height='18' rx='1'/><rect x='14' y='3' width='7' height='18' rx='1'/></svg>">
	<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
	<header>
		<div class="header-left">
			<svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<rect x="3" y="3" width="7" height="18" rx="1"/>
				<rect x="14" y="3" width="7" height="18" rx="1"/>
			</svg>
			<h1>Diffchecker</h1>
		</div>
		<div class="header-controls">
			<label class="toggle-switch" title="Enable code features (syntax highlighting, brackets)">
				<input type="checkbox" id="code-toggle">
				<span class="toggle-slider"></span>
				<span class="toggle-label">Code</span>
			</label>
			<button id="theme-toggle" class="theme-toggle" title="Toggle theme">&#9788;</button>
		</div>
	</header>

	<main>
		<div id="editor-container"></div>
	</main>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
